<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Rollout Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Axis-pinned to the single font-variation-settings used in index.css
         (~320KB woff2 instead of the ~4MB full variable font); display=block
         hides raw ligature text until the icon font is ready. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" />
    <!-- Inter (body) + IBM Plex Mono (tool output, analysis readouts) are
         SELF-HOSTED (public/fonts). They used to come from the Google CDN, but a
         cross-origin font cannot be inlined into the image-capture snapshot, so
         every exported figure silently rasterized in a fallback face. Same
         woff2 bytes, now same-origin — see public/fonts/fonts.css and
         src/utils/captureFonts.ts. -->
    <link rel="stylesheet" href="/fonts/fonts.css">
  </head>
  <body class="font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
